<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>적중1</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--line:#e3e7ef;--text:#111827;--muted:#667085;--blue:#dbeafe;--yellow:#fef08a;--pink:#ffe4e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--text)}.wrap{max-width:980px;margin:auto;padding:14px}.hero,.card,.pane{background:var(--card);border:1px solid var(--line);border-radius:18px}.hero{padding:18px}h1{margin:0;font-size:26px}.sub{font-size:13px;color:var(--muted);margin-top:5px}.search{display:flex;gap:8px;margin-top:14px}.search input{flex:1;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:17px}.btn{border:0;border-radius:12px;background:#111827;color:#fff;padding:12px 16px;font-weight:900}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}@media(max-width:680px){.split{grid-template-columns:1fr}.wrap{padding:9px}}.pane{padding:14px}.pane.current{border-top:4px solid #60a5fa}.pane.next{border-top:4px solid #eab308}.card{padding:14px;margin-top:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{font-size:17px;margin:0}.toggle{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-weight:800}.collapsed .body{display:none}.body{margin-top:12px}.balls,.chips{display:flex;flex-wrap:wrap;gap:7px}.ball{width:39px;height:39px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;background:#eef2f7;border:2px solid transparent;position:relative}.ball.current{background:var(--blue);border-color:#60a5fa}.ball.next{background:var(--yellow);border-color:#eab308}.ball.hit{box-shadow:0 0 0 3px #fb7185 inset}.shape{position:absolute;top:-7px;right:-6px;background:#111827;color:#fff;border-radius:8px;padding:1px 4px;font-size:10px}.chip{padding:6px 9px;background:#f3f4f6;border-radius:999px;font-size:13px;font-weight:800}.chip.hit{background:var(--yellow)}.label{font-size:12px;color:var(--muted);margin-bottom:6px}.block{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px}.main{background:#fff1f2}.support{background:#eff6ff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:680px){.grid2{grid-template-columns:1fr}}.status{font-size:13px;color:var(--muted);margin-top:10px}.week{padding:10px 0;border-top:1px dashed var(--line)}.week:first-child{border-top:0}.legend{font-size:12px;color:var(--muted);margin-top:8px}.shapeGrid{display:flex;flex-wrap:wrap;gap:7px}.shapeItem{border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-weight:800}
</style>
</head>
<body><main class="wrap">
<section class="hero"><h1>🎯 적중1</h1><div class="sub">직전 30회 연결수 + 주별 미출수 + 연결강도 압축</div><div class="search"><input id="round" inputmode="numeric" placeholder="회차 입력 (예: 1239)"><button class="btn" id="go">전회차 검색</button></div><div class="status" id="status"></div></section>
<div id="app"></div>
</main>
<script>
const API='https://smok95.github.io/lotto/results/all.json';const W=[5,10,15,20,25,30];const ALL=Array.from({length:45},(_,i)=>i+1);const $=s=>document.querySelector(s);
function norm(x){return {round:+x.draw_no,date:String(x.date||'').slice(0,10),numbers:(x.numbers||[]).map(Number),bonus:+x.bonus_no||0}}
function uniq(a){return [...new Set(a)].sort((a,b)=>a-b)}
function analyze(h,round){const latest=h.at(-1).round;round=Math.min(Math.max(+round||latest,h[0].round),latest);const idx=h.findIndex(x=>x.round===round);if(idx<0)throw Error('회차를 찾을 수 없습니다.');const cur=h[idx],next=h[idx+1]?.round===round+1?h[idx+1]:null;const win=h.slice(Math.max(0,idx-29),idx+1);const rset=new Set(win.map(x=>x.round));const per={},total=new Map(),cov=new Map();for(const seed of cur.numbers){const m=new Map();let occ=0;for(let i=0;i<=idx;i++){const d=h[i];if(!rset.has(d.round)||!d.numbers.includes(seed))continue;occ++;const nx=h[i+1];if(!nx||nx.round!==d.round+1||nx.round>round)continue;for(const n of nx.numbers)m.set(n,(m.get(n)||0)+1)}const links=[...m].map(([number,count])=>({number,count})).sort((a,b)=>b.count-a.count||a.number-b.number);per[seed]={seed,occ,links};for(const x of links){total.set(x.number,(total.get(x.number)||0)+x.count);if(!cov.has(x.number))cov.set(x.number,new Set());cov.get(x.number).add(seed)}}const missing={};for(const w of W){const used=new Set(h.slice(Math.max(0,idx-w+1),idx+1).flatMap(x=>x.numbers));missing[w]=ALL.filter(n=>!used.has(n))}const m5=new Set(missing[5]);const stats=ALL.map(number=>({number,count:total.get(number)||0,coverage:cov.get(number)?.size||0,missing5:m5.has(number),mw:W.filter(w=>missing[w].includes(number))})).filter(x=>x.count).sort((a,b)=>b.coverage-a.coverage||b.count-a.count||b.mw.length-a.mw.length||a.number-b.number);const main=stats.filter(x=>x.missing5).slice(0,4),support=stats.filter(x=>!x.missing5).slice(0,4);const eight=uniq([...main.map(x=>x.number),...support.map(x=>x.number)]);const score=x=>x.coverage*100+x.count*10+x.mw.length*2+(x.missing5?5:0);const es=new Set(eight);const ranked=stats.filter(x=>es.has(x.number)).sort((a,b)=>score(b)-score(a)||a.number-b.number);const six=ranked.slice(0,6).map(x=>x.number).sort((a,b)=>a-b),core=ranked.slice(0,3).map(x=>x.number).sort((a,b)=>a-b);const nset=new Set(next?.numbers||[]);const hits=eight.filter(n=>nset.has(n));const shapes=Object.fromEntries(stats.map(x=>[x.number,x.coverage>=5?'■':x.coverage>=4?'▲':x.coverage>=3?'ㄱ':x.coverage>=2?'ㄴ':'·']));return{round,latest,cur,next,start:win[0].round,per,missing,stats,main,support,eight,six,core,hits,shapes}}
function balls(nums,cls='',hits=[],sh={}){const hs=new Set(hits);return '<div class="balls">'+(nums||[]).map(n=>'<span class="ball '+cls+(hs.has(n)?' hit':'')+'">'+n+(sh[n]?'<span class="shape">'+sh[n]+'</span>':'')+'</span>').join('')+'</div>'}
function chips(arr,hits=[]){const hs=new Set(hits);return '<div class="chips">'+(arr||[]).map(x=>{const n=typeof x==='number'?x:x.number;const c=typeof x==='number'?'':' · '+x.count+'회';return '<span class="chip '+(hs.has(n)?'hit':'')+'">'+n+c+'</span>'}).join('')+'</div>'}
function sec(t,b,open=true){return '<section class="card '+(open?'':'collapsed')+'"><div class="head"><h2>'+t+'</h2><button class="toggle">'+(open?'접기':'펴기')+'</button></div><div class="body">'+b+'</div></section>'}
function render(d){const nextNums=d.next?.numbers||[];let html='<div class="split"><div class="pane current"><div class="head"><h2>'+d.round+'회 당번</h2><span class="label">'+d.start+'~'+d.round+' · 30회</span></div>'+balls(d.cur.numbers,'current')+'</div><div class="pane next"><div class="head"><h2>'+(d.next?d.next.round:d.round+1)+'회 다음회차</h2><span class="label">'+(d.next?'실제 당첨번호':'추첨 전')+'</span></div>'+(d.next?balls(nextNums,'next',d.hits,d.shapes):'<div class="label">결과 대기</div>')+'</div></div>';
html+=sec('적중1 압축','<div class="grid2"><div class="block main"><b>미출 연결 주력</b>'+chips(d.main,nextNums)+'</div><div class="block support"><b>최근출현 연결 보강</b>'+chips(d.support,nextNums)+'</div></div><div class="block"><div class="label">8수 압축</div>'+balls(d.eight,'',nextNums,d.shapes)+'</div><div class="block"><div class="label">6수 압축</div>'+balls(d.six,'',nextNums,d.shapes)+'</div><div class="block"><div class="label">핵심 3수</div>'+balls(d.core,'',nextNums,d.shapes)+'</div><div class="legend">노랑=다음회차 실제 당번 · 분홍 안쪽=압축수 적중</div>');
let mw='';for(const w of W)mw+='<div class="week"><b>'+w+'주 미출수</b>'+chips(d.missing[w],nextNums)+'</div>';html+=sec('미출수 주별 5·10·15·20·25·30주',mw,false);
let ps='';for(const seed of d.cur.numbers){const x=d.per[seed],top=x.links.slice(0,12),hit=top.filter(z=>nextNums.includes(z.number)).map(z=>z.number);ps+='<div class="block"><b>당번 '+seed+'번</b><div class="label">30회 출현 '+x.occ+'회 · 다음회차 연결 상위</div>'+chips(top,nextNums)+'<div class="label" style="margin-top:8px">실제 다음회차에서 나온 연결수</div>'+(hit.length?balls(hit,'next',hit,d.shapes):'<span class="label">없음 / 결과 대기</span>')+'</div>'}html+=sec('당번 번호별 연결수 요약',ps,false);
html+=sec('도형 연결 강도','<div class="shapeGrid">'+d.stats.slice(0,18).map(x=>'<span class="shapeItem">'+d.shapes[x.number]+' '+x.number+' · 기준 '+x.coverage+'개 · '+x.count+'회</span>').join('')+'</div><div class="legend">■ 5개+ · ▲ 4개 · ㄱ 3개 · ㄴ 2개 · · 1개</div>',false);$('#app').innerHTML=html;document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const s=b.closest('.card');s.classList.toggle('collapsed');b.textContent=s.classList.contains('collapsed')?'펴기':'접기'})}
async function load(){try{$('#status').textContent='분석 중…';const h=(await (await fetch(API)).json()).map(norm).filter(x=>x.round).sort((a,b)=>a.round-b.round);const d=analyze(h,$('#round').value);$('#round').value=d.round;render(d);$('#status').textContent='최신 '+d.latest+'회 · 선택 '+d.round+'회 · 적중1 고정 방식';history.replaceState(null,'','?round='+d.round)}catch(e){$('#status').textContent='오류: '+e.message}}
$('#go').onclick=load;$('#round').onkeydown=e=>{if(e.key==='Enter')load()};const q=new URLSearchParams(location.search).get('round');if(q)$('#round').value=q;load();
</script></body></html>
