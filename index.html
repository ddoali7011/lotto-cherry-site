<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>적중1</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--line:#e3e7ef;--text:#111827;--muted:#667085;--blue:#dbeafe;--yellow:#fef08a;--red:#fee2e2;--green:#dcfce7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--text)}.wrap{max-width:980px;margin:auto;padding:12px}.hero,.card,.pane{background:#fff;border:1px solid var(--line);border-radius:18px}.hero{padding:18px}h1{margin:0;font-size:26px}.sub,.label,.status,.legend{font-size:12px;color:var(--muted)}.search{display:flex;gap:8px;margin-top:14px}.search input{flex:1;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:17px}.btn{border:0;border-radius:12px;background:#111827;color:#fff;padding:12px 16px;font-weight:900}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}@media(max-width:680px){.split{grid-template-columns:1fr}.wrap{padding:8px}}.pane{padding:14px}.pane.current{border-top:4px solid #60a5fa}.pane.next{border-top:4px solid #eab308}.card{padding:14px;margin-top:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{font-size:17px;margin:0}.toggle{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-weight:800}.collapsed .body{display:none}.body{margin-top:12px}.balls,.chips{display:flex;flex-wrap:wrap;gap:7px}.ball{width:39px;height:39px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;background:#eef2f7;border:2px solid transparent}.ball.current{background:var(--blue);border-color:#60a5fa}.ball.next{background:var(--yellow);border-color:#eab308}.ball.hit{box-shadow:0 0 0 3px #fb7185 inset}.chip{padding:6px 9px;background:#f3f4f6;border-radius:999px;font-size:13px;font-weight:800}.chip.hit{background:var(--yellow)}.block{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px}.ten{background:#f0fdf4}.thirty{background:#eff6ff}.repeat{background:#fff7ed}.seed{font-weight:900;font-size:16px;margin-bottom:7px}.divider{height:1px;background:var(--line);margin:12px 0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;background:#111827;color:#fff}
</style></head><body><main class="wrap">
<section class="hero"><h1>🎯 적중1</h1><div class="sub">기존 30회 기준 유지 + 10회 기준 별도 추가</div><div class="search"><input id="round" inputmode="numeric" placeholder="회차 입력 (예: 1239)"><button class="btn" id="go">전회차 검색</button></div><div class="status" id="status"></div></section><div id="app"></div></main>
<script>
const API='https://smok95.github.io/lotto/results/all.json',ALL=[...Array(45)].map((_,i)=>i+1),$=s=>document.querySelector(s);
const norm=x=>({round:+x.draw_no,numbers:(x.numbers||[]).map(Number),bonus:+x.bonus_no||0});
const uniq=a=>[...new Set(a)].sort((a,b)=>a-b);
function analyzeWindow(h,round,size){const latest=h.at(-1).round;round=Math.min(Math.max(+round||latest,h[0].round),latest);const idx=h.findIndex(x=>x.round===round);if(idx<0)throw Error('회차를 찾을 수 없습니다.');const cur=h[idx],next=h[idx+1]?.round===round+1?h[idx+1]:null,start=Math.max(0,idx-size+1),win=h.slice(start,idx+1),rset=new Set(win.map(x=>x.round)),baseSet=new Set(cur.numbers),per={},coverage=new Map(),total=new Map();
for(const seed of cur.numbers){const m=new Map();let occ=0;for(let i=start;i<=idx;i++){const d=h[i];if(!d.numbers.includes(seed))continue;occ++;const nx=h[i+1];if(!nx||nx.round!==d.round+1||nx.round>round)continue;for(const n of nx.numbers){if(baseSet.has(n))continue;m.set(n,(m.get(n)||0)+1)}}const links=[...m].map(([number,count])=>({number,count})).sort((a,b)=>b.count-a.count||a.number-b.number);per[seed]={occ,links};for(const x of links){total.set(x.number,(total.get(x.number)||0)+x.count);if(!coverage.has(x.number))coverage.set(x.number,new Set());coverage.get(x.number).add(seed)}}
const repeated=ALL.map(number=>({number,count:total.get(number)||0,coverage:coverage.get(number)?.size||0})).filter(x=>x.coverage>=2).sort((a,b)=>b.coverage-a.coverage||b.count-a.count||a.number-b.number);return{round,latest,cur,next,startRound:win[0].round,size,per,repeated}}
function chips(arr,nextNums=[]){const ns=new Set(nextNums);return '<div class="chips">'+(arr||[]).map(x=>{const n=typeof x==='number'?x:x.number;const t=typeof x==='number'?String(n):n+' · '+x.count+'회';return '<span class="chip '+(ns.has(n)?'hit':'')+'">'+t+'</span>'}).join('')+'</div>'}
function balls(arr,cls='',hits=[]){const hs=new Set(hits);return '<div class="balls">'+arr.map(n=>'<span class="ball '+cls+(hs.has(n)?' hit':'')+'">'+n+'</span>').join('')+'</div>'}
function sec(title,body,open=true,extra=''){return '<section class="card '+extra+' '+(open?'':'collapsed')+'"><div class="head"><h2>'+title+'</h2><button class="toggle">'+(open?'접기':'펴기')+'</button></div><div class="body">'+body+'</div></section>'}
function renderWindow(d,label,klass){const nextNums=d.next?.numbers||[],base=d.cur.numbers;let body='<div class="label">분석범위 '+d.startRound+'~'+d.round+'회 · 기준 당번은 모든 후보에서 제외</div>';
for(const seed of base){const p=d.per[seed];body+='<div class="block"><div class="seed">'+seed+'번 기준</div><div class="label">'+d.size+'회 내 기준번호 출현 '+p.occ+'회 · 기준당번 제외 연결수</div>'+chips(p.links.slice(0,18),nextNums)+'</div>'}
body+='<div class="block repeat"><div class="seed">번호별 반복 겹침수</div><div class="label">서로 다른 기준번호 2개 이상에서 반복된 수</div>'+chips(d.repeated,nextNums)+'</div>';
return sec(label+' · 기준번호별 분석',body,false,klass)}
function render(d30,d10){const nextNums=d30.next?.numbers||[];let html='<div class="split"><div class="pane current"><div class="head"><h2>'+d30.round+'회 기준 당번</h2><span class="badge">기준번호 제외</span></div>'+balls(d30.cur.numbers,'current')+'</div><div class="pane next"><div class="head"><h2>'+(d30.next?d30.next.round:d30.round+1)+'회 다음회차</h2><span class="label">'+(d30.next?'실제 당첨번호':'추첨 전')+'</span></div>'+(d30.next?balls(nextNums,'next',nextNums):'<div class="label">결과 대기</div>')+'</div></div>';
html+=renderWindow(d30,'기존 30회 기준','thirty');html+=renderWindow(d10,'새 10회 기준','ten');
html+=sec('30회 ↔ 10회 반복수 비교','<div class="block thirty"><b>30회 반복수</b>'+chips(d30.repeated,nextNums)+'</div><div class="block ten"><b>10회 반복수</b>'+chips(d10.repeated,nextNums)+'</div><div class="block repeat"><b>30회·10회 둘 다 반복된 수</b>'+chips(uniq(d30.repeated.map(x=>x.number).filter(n=>d10.repeated.some(y=>y.number===n))),nextNums)+'</div>',true);
$('#app').innerHTML=html;document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const s=b.closest('.card');s.classList.toggle('collapsed');b.textContent=s.classList.contains('collapsed')?'펴기':'접기'})}
async function load(){try{$('#status').textContent='분석 중…';const h=(await (await fetch(API)).json()).map(norm).filter(x=>x.round).sort((a,b)=>a.round-b.round),r=$('#round').value||h.at(-1).round,d30=analyzeWindow(h,r,30),d10=analyzeWindow(h,r,10);$('#round').value=d30.round;render(d30,d10);$('#status').textContent='최신 '+d30.latest+'회 · 선택 '+d30.round+'회 · 30회 유지 / 10회 별도 추가';history.replaceState(null,'','?round='+d30.round)}catch(e){$('#status').textContent='오류: '+e.message}}
$('#go').onclick=load;$('#round').onkeydown=e=>{if(e.key==='Enter')load()};const q=new URLSearchParams(location.search).get('round');if(q)$('#round').value=q;load();
</script></body></html>
